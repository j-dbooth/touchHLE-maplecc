name: Build Android APK (touchHLE MapleCC)

on:
  push:
    branches: [ "maplecc-support", "trunk" ]
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always
  ANDROID_HOME: /usr/local/lib/android/sdk
  ANDROID_SDK_ROOT: /usr/local/lib/android/sdk
  ANDROID_NDK_ROOT: /usr/local/lib/android/sdk/ndk/25.2.9519653
  ANDROID_NDK_HOME: /usr/local/lib/android/sdk/ndk/25.2.9519653
  ANDROID_NDK: /usr/local/lib/android/sdk/ndk/25.2.9519653

jobs:
  build-android:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4
      with:
        submodules: recursive
        fetch-depth: 0

    - name: Set up Java 17
      uses: actions/setup-java@v4
      with:
        distribution: 'temurin'
        java-version: '17'

    - name: Try to get cached copy of Boost
      id: cache-boost
      uses: actions/cache@v3
      with:
        path: vendor/boost
        key: boost_1_81_0

    - if: ${{ steps.cache-boost.outputs.cache-hit != 'true' }}
      name: Download Boost
      run: curl -L -o boost_1_81_0.7z "https://archives.boost.io/release/1.81.0/source/boost_1_81_0.7z"

    - if: ${{ steps.cache-boost.outputs.cache-hit != 'true' }}
      name: Extract Boost
      run: |
        7z -ovendor x boost_1_81_0.7z
        mv vendor/boost_1_81_0 vendor/boost

    - name: Try to get cached copy of cmake
      id: cache-cmake
      uses: actions/cache@v3
      with:
        path: vendor/cmake
        key: cmake_3_31_6_linux

    - if: ${{ steps.cache-cmake.outputs.cache-hit != 'true' }}
      name: Download Cmake
      run: curl -L -O "https://github.com/Kitware/CMake/releases/download/v3.31.6/cmake-3.31.6-linux-x86_64.tar.gz"

    - if: ${{ steps.cache-cmake.outputs.cache-hit != 'true' }}
      name: Extract Cmake
      run: |
        tar xzvf "cmake-3.31.6-linux-x86_64.tar.gz" -C vendor
        mv vendor/cmake-3.31.6-linux-x86_64 vendor/cmake

    - name: Install AArch64 Android Rust toolchain
      run: rustup target add aarch64-linux-android

    - name: Install cargo-ndk
      run: cargo install cargo-ndk@3.5.4

    - name: Try to get a cached copy of Gradle
      id: cache-gradle
      uses: actions/cache@v3
      with:
        path: gradle
        key: gradle-8.11.1

    - if: ${{ steps.cache-gradle.outputs.cache-hit != 'true' }}
      name: Download Gradle
      run: curl -L -o gradle-8.11.1-bin.zip "https://services.gradle.org/distributions/gradle-8.11.1-bin.zip"

    - if: ${{ steps.cache-gradle.outputs.cache-hit != 'true' }}
      name: Extract Gradle
      run: 7z -ogradle x gradle-8.11.1-bin.zip

    - name: Set up Android NDK 25.2.9519653
      run: |
        sudo mkdir -p "$ANDROID_HOME/ndk"
        if [ ! -d "$ANDROID_NDK_ROOT" ]; then
          echo "NDK 25.2.9519653 not found at $ANDROID_NDK_ROOT, downloading..."
          curl -L -o ndk.zip "https://dl.google.com/android/repository/android-ndk-r25c-linux.zip"
          sudo unzip -q ndk.zip -d "$ANDROID_HOME/ndk"
          sudo mv "$ANDROID_HOME/ndk/android-ndk-r25c" "$ANDROID_NDK_ROOT"
          rm -f ndk.zip
        fi
        sudo chmod -R a+rwx "$ANDROID_HOME/ndk"
        echo "NDK ready at $ANDROID_NDK_ROOT:"
        ls -la "$ANDROID_NDK_ROOT"

    - name: Generate local.properties file
      run: |
        echo "sdk.dir=$ANDROID_HOME" > android/local.properties
        echo "ndk.dir=$ANDROID_NDK_ROOT" >> android/local.properties
        cat android/local.properties

    - name: Stage Bundled Game Assets
      run: |
        mkdir -p android/app/src/main/assets/touchHLE_apps
        if [ -d "touchHLE_apps/MapleCC.app" ] && [ ! -d "android/app/src/main/assets/touchHLE_apps/MapleCC.app" ]; then
          cp -r touchHLE_apps/MapleCC.app android/app/src/main/assets/touchHLE_apps/
        fi
        echo "Assets staged:"
        ls -la android/app/src/main/assets/touchHLE_apps/MapleCC.app || true

    - name: Build for Android
      run: |
        chmod +x gradle/gradle-8.11.1/bin/gradle
        export PATH="${{ github.workspace }}/vendor/cmake/bin:$PATH"
        cd android
        ../gradle/gradle-8.11.1/bin/gradle assembleRelease --stacktrace
        cd ..
        find android/app/build/outputs/apk -name "*.apk" -exec ls -la {} \;
        cp android/app/build/outputs/apk/release/app-release.apk touchHLE_MapleCC.apk
      env:
        CMAKE: ${{ github.workspace }}/vendor/cmake/bin/cmake

    - name: Upload Android APK
      uses: actions/upload-artifact@v4
      with:
        name: touchHLE_MapleCC_Android_APK
        path: touchHLE_MapleCC.apk
